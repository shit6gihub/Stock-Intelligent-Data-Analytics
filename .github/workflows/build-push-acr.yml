name: build-push-acr

# 发版构建: tag 推送触发 → 构建镜像 → 推阿里云 ACR(国内拉取快)
# 解决: ACR 代码源构建无法拉取 private 仓库代码的问题
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # 拉取私有 ghcr.io/xiaoze-hub/thsdk-vendor(L2 私有 SDK)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: ver
        run: |
          V=$(cat VERSION 2>/dev/null || echo "0.0.0")
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (thsdk vendor)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: xiaoze-hub
          # GITHUB_TOKEN 拉不到账号级其他私有包, 用经典 PAT(write:packages)
          password: ${{ secrets.GHCR_PAT }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com/xiaozexwz/xzxwz:${{ steps.ver.outputs.version }}
            crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com/xiaozexwz/xzxwz:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          # 个人版 ACR 不支持 OCI attestation 清单(unknown manifest class for empty.v1+json)
          provenance: false
          sbom: false
