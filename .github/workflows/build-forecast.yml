name: Build forecast image to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shit6gihub
          password: ${{ secrets.PAT }}

      - name: Build and push forecast image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.forecast
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stock-intelligent-data-analytics-forecast:${{ github.event.inputs.tag }}
