# 数智分析 (PanWatch fork) 一键部署编排
#
# 用途: 朋友在新服务器上 fork 仓库 + 拉公开镜像后,一条命令启主后端 + 预测引擎
# 镜像源: ghcr.io/xiaoze-hub/stock-intelligent-data-analytics(主) + -forecast(预测)
# 公开: 匿名可拉,无需 PAT
#
# 启动: docker compose up -d
# 停止: docker compose down
# 日志: docker compose logs -f
#
# 数据持久化:
#   - 命名卷 panwatch_data(主后端 DB + Playwright 浏览器)
#   - 命名卷 panwatch_forecast_data(预测引擎 SQLite + 回测报告)
#   - 可选 bind 挂载 ~/.hermes(cron 输出只读)+ ~/Obsidian/FinanceVault(报告中心同步目标)

services:
  # ============== 主后端 8000 (FastAPI) ==============
  panwatch:
    image: ghcr.io/xiaoze-hub/stock-intelligent-data-analytics:latest
    container_name: panwatch
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 指向同 compose 网络内的 forecast 服务(Docker DNS 自动解析)
      - FORECAST_ENGINE_URL=http://forecast:8010
      # Hermes cron 输出根目录(可选,挂载 ~/.hermes 后自动可用)
      - HERMES_HOME=/hermes
      # Obsidian vault 根目录(可选,挂载后报告中心「同步到 Obsidian」可用)
      - OBSIDIAN_VAULT=/obsidian-vault
      # 数据源 key 在「设置 → 接口Key」UI 维护;此处只传 Hermes 必需的环境变量
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - DOCKER=1
    volumes:
      - panwatch_data:/app/data
      # 可选: Hermes cron 输出(报告中心读取 cron 报告用)
      # ⚠️ 朋友请改成自己的路径,不存在会自动创建空目录不影响服务启动
      - ~/.hermes:/hermes:ro
      # 可选: Obsidian vault 双向同步(报告中心「同步到 Obsidian」写入目标)
      # ⚠️ 朋友请改成自己的路径,不存在会自动创建空目录不影响服务启动
      - ./obsidian-vault:/obsidian-vault:rw
    depends_on:
      forecast:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ============== 预测引擎 8010 (Kronos/XGBoost/Lag-Llama/LinearReg) ==============
  forecast:
    image: ghcr.io/xiaoze-hub/stock-intelligent-data-analytics-forecast:latest
    container_name: panwatch-forecast
    restart: unless-stopped
    expose:
      - "8010"   # 不暴露给主机,仅 compose 网络内访问
    environment:
      # 预测引擎经 8000 拿资金面/龙虎榜数据(fork 镜像里 /api/market-data/* 已就绪)
      - PANWATCH_URL=http://panwatch:8000
      # 直接读取设置页的 forecast_llm_* 配置，保存后无需脚本或重启
      - PANWATCH_DB=/app/panwatch-data/panwatch.db
      # 预测历史必须落到 panwatch_forecast_data 命名卷
      - FORECAST_DB_PATH=/app/data/panwatch_forecast.db
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    volumes:
      # 预测历史 SQLite(回测报告/预测记录/资金面 LLM 情绪记录)
      - panwatch_forecast_data:/app/data
      # 预测引擎只读查询 PanWatch 设置；SQLite 需要目录可写以维护锁文件
      - panwatch_data:/app/panwatch-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s   # Kronos 模型加载 ~25s
      retries: 3

volumes:
  panwatch_data:
    name: panwatch_data
  panwatch_forecast_data:
    name: panwatch_forecast_data
